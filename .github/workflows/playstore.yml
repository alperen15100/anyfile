name: Build Play Store APK + AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore ANYFILE signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > keystore/anyfile-upload-key.jks
          test -s keystore/anyfile-upload-key.jks
          echo "ANYFILE keystore restored successfully."

      - name: Create keystore properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storeFile=keystore/anyfile-upload-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Verify signing files
        run: |
          test -s keystore/anyfile-upload-key.jks
          test -s keystore.properties
          echo "Signing files are ready."

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANYFILE-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ANYFILE-PLAY-STORE-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
